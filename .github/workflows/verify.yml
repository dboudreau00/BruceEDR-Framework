name: verify

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Verify (build + test + rules + replay)
        shell: pwsh
        run: |
          # Same entrypoint as a local pre-PR check. verify.ps1 already avoids
          # --no-build on test (Release|x64 vs default platform trap).
          ./tools/verify.ps1 -Configuration Release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
